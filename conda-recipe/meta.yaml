package:
  name: q2-mfa
  version: {{ PLUGIN_VERSION }}

source:
  path: ..

build:
  script: make install

requirements:
  host:
    - python {{ python }}
    - setuptools
    - versioningit
    - wheel

  build:
    - python {{ python }}
    - setuptools
    - versioningit

  run:
    - scikit-bio
    - r-imputelcmd
    - r-missforest
    - r-optparse
    - qiime2 >={{ qiime2 }}
    - q2-types >={{ q2_types }}

test:
  requires:
    - parameterized
  imports:
    - q2_mfa
    - qiime2.plugins.mfa
  commands:
    - pytest --pyargs q2_mfa

about:
  home: https://github.com/bokulich-lab/q2-q2_mfa
  license: BSD-3-Clause
  license_family: BSD
